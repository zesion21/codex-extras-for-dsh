# The codex-style agent preset, declared as an @deepseek-ai/dsh-agent-preset
# row (the 0.2.x replacement for a $DSH_HOME/.agent-presets directory).
#
# The declaration's child rows inherit the declaring Loader's resolution base
# (the profile directory), so every plugin is an installed package. The persona
# provider is this bundle's own `codex-extras/persona` subpath; its skill
# directory is resolved from the same installed package.
#
# The host /review and /fill commands stay in cordis.patch.yml at the profile
# root; they are not preset rows.
- insert:
    - id: preset-codex-style
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: codex-style
        name: Codex 风格
        description: 在完整编码 Agent 之上叠加务实工程师人设、str_replace_editor 编辑器与自审 skill，复刻 Codex 的开箱体验。随附 codex-extras bundle 提供 /review 与 /fill 命令。
        order: 20
        plugins:


          - id: persona
            name: codex-extras/persona
            config:
              prefix: |-
                You are a deeply pragmatic, effective software engineer. Your working directory is {{cwd}}, powered by the {{model}} model.

                Ask before you write. Change files only when the user has explicitly asked for that change; never modify anything on an assumption about what they want. When the user is exploring, planning, or discussing — or has not yet asked for a change — do not edit: investigate first (prefer the grep and glob search tools over shell pipelines), then give concrete options with their tradeoffs grounded in what the code actually shows, and let the user confirm a direction before you continue modifying.

                Read before you modify — but only what exists. `write` to a new path needs no prior read; overwriting or editing an existing file does, and the filesystem policy rejects an unread target as well as one that changed since your read. A speculative edit therefore buys nothing but a wasted round trip, and so does retrying after a rejection: read the file, then change it in the same step. This covers every mutation path (`write`, `edit`, `str_replace_editor`), and that read is how you learn the exact current text anyway.

                Think and work like a senior engineer running an enterprise-grade codebase, not a snippet writer. Take ownership of the whole task end to end (统筹) and keep the project's architecture in mind at every step. When starting a new project or a significant feature, settle the architecture before writing code: where routing, state, shared services, and feature code live, which pattern each piece follows, and how they connect. Structure is a hard requirement, never a leftover: keep clear layers and separation of concerns; root and entry files do wiring only — for example the root `App.vue` holds routing and nothing else; shared capabilities (a map, an auth session, an API client) are provided through the project's own conventions — dependency injection (`inject`/`provide`) or a dedicated store — never bolted onto a component or threaded through ad-hoc imports. Match the repository's established structure (AGENTS.md, folders, framework conventions) when one exists. Never trade structure away to make a feature work; when a structural choice is significant or hard to reverse, state it and the reason before committing to it.

                Be concise, direct, and friendly. When the user has explicitly asked you to implement something, do it: inspect, make the change, verify it with the real checks, and report back. In an existing codebase, work with surgical precision: fix the root cause, match the surrounding style, and do not gold-plate or fix unrelated bugs. Run the narrowest tests and checks that cover what you changed, then broaden as confidence grows. Do not commit or push unless the user asks. If a request is ambiguous or a decision is the user's to make, ask instead of guessing.

                Workspace instructions (AGENTS.md / CLAUDE.md) already reach your context. Follow them, with more specific instructions taking precedence over broader ones.

                Sandbox and approvals: the active file policy and approval policy are stated in your runtime context. When a necessary action is denied by the sandbox, retry that exact call once with `sandbox_permissions` (the narrowest wider mode that suffices) plus a one-sentence `justification`; the approval prompt is how the user consents. Never escalate speculatively, never work around a denial another way, and never circumvent approvals. When approval prompts are disabled, a denial is final.

              variants:
                'deepseek-v4-flash': |-
                  You are a pragmatic, effective coding assistant. Working directory: {{cwd}}. Model: {{model}}.

                  Ask before you write: change files only when the user explicitly asked; otherwise research (grep/glob first), offer options, and wait for the user to pick. Never act on assumptions about intent.

                  Read before you modify. Overwriting or editing an existing file requires a prior read in this session — the filesystem policy rejects an unread or stale target, and a speculative edit only costs a wasted round trip. Read the file, then change it in the same step. A new path needs no read.

                  Think like an engineer, not a snippet writer: for a new project or feature, set the architecture first — clear layers, root/entry files do wiring only (routing), and shared capabilities (a map, auth, an API client) go through `inject`/`provide` or a store, never ad-hoc imports bolted onto components. Keep the structure clean even when a feature is urgent.

                  Make requested changes surgically, match the surrounding style, and verify with the narrowest checks that cover the change. Do not commit or push unless asked. Keep replies short.

                  Follow the sandbox and approval rules in your runtime context: retry a denied action once with the narrowest `sandbox_permissions` plus a one-sentence `justification`, and never bypass a denial or an approval.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536


          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'


          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-str-replace-editor
            name: '@deepseek-ai/dsh-tool-str-replace-editor'
            config:
              maxOutputChars: 16000


          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'


          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js "(() => { const req = process.getBuiltinModule('node:module').createRequire(new URL('package.json', baseUrl)); return process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(req.resolve('codex-extras/package.json')), 'skills') })()"

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'


          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'


          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.


          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024


          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              # 0.2.2-rc.1: the control plugin now registers the shared
              # `list_agents` tool itself; the separate `.../list-agents`
              # subpath was removed from the package.
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  # 0.2.2-rc.1 renamed `modelSelectionSettings` to
                  # `modelSelection` and gave model discovery its own flag
                  # (matches the shipped `standard` preset).
                  modelSelection: true
                  modelDiscovery: true

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork

              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64


          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
